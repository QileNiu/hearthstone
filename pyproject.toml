[project]
name = "hearthstone-text-control"
version = "0.1.0"
description = "Text-command accessibility controller prototype for Hearthstone."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
windows = ["pyautogui>=0.9.54"]

[project.scripts]
hearthstone-control = "hearthstone_text_control.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hearthstone_text_control.profiles" = ["*.json"]
